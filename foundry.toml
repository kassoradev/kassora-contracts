[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 500
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[fuzz]
runs = 256

[invariant]
runs = 64
depth = 32
fail_on_revert = false

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false

# Endpoints come from .env (see .env.example). Never commit a .env file.
[rpc_endpoints]
robinhood = "${ROBINHOOD_RPC_URL}"
robinhood_testnet = "${ROBINHOOD_TESTNET_RPC_URL}"

# Blockscout verification (no API key needed).
[etherscan]
robinhood = { key = "", url = "https://robinhoodchain.blockscout.com/api", chain = 4663 }

# CI: same settings, more fuzz runs.
[profile.ci]
fuzz = { runs = 2048 }
invariant = { runs = 256, depth = 64 }
